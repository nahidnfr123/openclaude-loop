name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: CI only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Configure git for disposable test repositories
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "CI"
          git config --global init.defaultBranch main

      - name: Validate plugin and marketplace manifests
        run: python scripts/validate.py

      # The suite drives tests/fake_opencode.py. It never contacts a model
      # provider, so CI needs no OpenCode authentication and spends no quota.
      - name: Run contract tests
        run: python -m unittest discover -s tests -v

  manifests:
    name: manifest schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate JSON syntax and required manifest fields
        run: |
          python - <<'PY'
          import json, re, sys
          errors = []
          plugin = json.load(open(".claude-plugin/plugin.json", encoding="utf-8"))
          market = json.load(open(".claude-plugin/marketplace.json", encoding="utf-8"))
          if plugin.get("name") != "openclaude-loop":
              errors.append("plugin.json name must be openclaude-loop")
          if not re.fullmatch(r"\d+\.\d+\.\d+([-+].*)?", str(plugin.get("version", ""))):
              errors.append("plugin.json version must be semantic, with no leading v")
          if market.get("name") != "openclaude-loop":
              errors.append("marketplace.json name must be openclaude-loop")
          entries = market.get("plugins") or []
          if len(entries) != 1 or entries[0].get("name") != "openclaude-loop":
              errors.append("marketplace.json must expose exactly the openclaude-loop plugin")
          elif entries[0].get("source") != "./":
              errors.append("marketplace source must be ./ for a root plugin")
          elif entries[0].get("version") != plugin.get("version"):
              errors.append("marketplace entry version must match plugin.json version")
          print("\n".join(errors) if errors else "Manifests OK")
          sys.exit(bool(errors))
          PY

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Scan tracked files and history for credentials
        run: |
          PATTERN='sk-[A-Za-z0-9_-]{16,}|ghp_[A-Za-z0-9]{20,}|gho_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|BEGIN [A-Z ]*PRIVATE KEY|xox[baprs]-'
          if git ls-files -z | xargs -0 grep -nIE "$PATTERN"; then
            echo "::error::Possible credential in tracked files"
            exit 1
          fi
          if git log -p --all | grep -IE "$PATTERN"; then
            echo "::error::Possible credential in git history"
            exit 1
          fi
          echo "No credential patterns found."
